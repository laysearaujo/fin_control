<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23198754'><path d='M8.5 1h-1A1.5 1.5 0 0 0 6 2.5V3h4v-.5A1.5 1.5 0 0 0 8.5 1M11 3v-.5A2.5 2.5 0 0 0 8.5 0h-1A2.5 2.5 0 0 0 5 2.5V3H2.5A1.5 1.5 0 0 0 1 4.5v9A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 13.5 3zM3 6V4.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 .5.5V6zm4.5 4.5a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0m1 0a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0'/></svg>">
    <title>Guardião</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background:
                radial-gradient(circle at 15% 15%, rgba(25, 135, 84, 0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(25, 135, 84, 0.12), transparent 45%),
                #f4f6f9;
        }

        .auth-card { max-width: 440px; width: 100%; }

        .auth-panel {
            border: none;
            border-radius: 28px;
            box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.15);
            padding: 2.75rem 2.25rem;
        }

        .auth-input {
            border-radius: 14px;
            border: 1.5px solid #e5e9f0;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }
        .auth-input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }
        .input-group .auth-input { border-left: none; }
        .input-group-text {
            background: #fff;
            border: 1.5px solid #e5e9f0;
            border-right: none;
            border-radius: 14px 0 0 14px;
            color: #9ca3af;
        }
        .input-group:focus-within .input-group-text { border-color: #22c55e; }
        .input-group:focus-within .auth-input { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15); }

        .btn-auth-primary {
            border-radius: 14px;
            padding: 0.8rem;
            font-weight: 700;
            border: none;
            color: #fff;
            background: linear-gradient(135deg, #22c55e, #15803d);
            box-shadow: 0 10px 20px -8px rgba(21, 128, 61, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-auth-primary:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 14px 25px -8px rgba(21, 128, 61, 0.6);
        }

        .signup-teaser {
            border-radius: 18px;
            background: linear-gradient(160deg, rgba(34, 197, 94, 0.08), rgba(34, 197, 94, 0.02));
            border: 1.5px dashed rgba(34, 197, 94, 0.35);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold m-0"><i class="bi bi-safe2-fill text-success"></i> Guardião<span class="text-success">.</span></h2>
            <p class="text-muted small mb-0 mt-1">Controle suas finanças: contas, cartões e caixinhas num só lugar.</p>
        </div>
        <div class="card auth-panel bg-white">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
