{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-5">
            <h3 class="fw-bold mb-1 text-center text-dark">💸 Pagar Conta Fixa</h3>
            <p class="text-muted text-center mb-4">Dando baixa em: <strong class="text-dark">{{ fixed_expense.name }}</strong></p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase">Valor Real Pago</label>
                    <input type="number" step="0.01" name="valor_real" class="form-control form-control-lg" value="{{ suggested_amount|stringformat:'.2f' }}">
                    <small class="text-muted">Edite se o valor veio diferente do previsto.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Data do Pagamento</label>
                    <input type="date" name="data_pagamento" class="form-control form-control-lg" value="{% now 'Y-m-d' %}">
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg rounded-pill fw-bold shadow-sm">Confirmar Pagamento</button>
                <a href="javascript:history.back()" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
